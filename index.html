}

window.addEventListener("resize",()=>fit(false));


// ---------- Search: composition-safe, with one current result list ----------
const q=$("#q"), sug=$("#sug"), clearSearch=$("#qclear");
let sugList=[], sugOn=-1, composing=false;
function hideSearch(){
  sugList=[];sugOn=-1;sug.style.display='none';sug.innerHTML='';
  q.setAttribute('aria-expanded','false');q.removeAttribute('aria-activedescendant');
  clearSearch.hidden=!q.value;
}
function searchableNames(n){
  // A renamed character is searchable only by names known at the current chapter.
  const future=new Set(!showAll?n.alt.filter(a=>a.from>chapter).map(a=>a.name):[]);
  return [dispName(n),...n.aliases.filter(a=>!future.has(a))];
}
function search(){
  clearSearch.hidden=!q.value;
  const v=q.value.trim();if(!v){hideSearch();$('#search-status').textContent='';return}
  sugList=DATA.nodes.filter(n=>!n.ph&&visN(n)&&searchableNames(n).some(a=>a.includes(v))).slice(0,8);sugOn=-1;
  sug.innerHTML=sugList.length?sugList.map((n,i)=>`<button type="button" class="soption" role="option" tabindex="-1" aria-selected="false" id="sopt-${n.id}" data-i="${i}"><span>${dispName(n)}</span><span class="house">${HOUSE_NAME[n.house]}</span></button>`).join(''):'<div class="none">没有找到已出场的人物</div>';
  sug.style.display='block';q.setAttribute('aria-expanded','true');q.removeAttribute('aria-activedescendant');
  $('#search-status').textContent=sugList.length?`找到 ${sugList.length} 位人物`:'没有找到已出场的人物';
  sug.querySelectorAll('[data-i]').forEach(b=>{b.onpointerdown=e=>e.preventDefault();b.onclick=()=>pick(+b.dataset.i)});
}
function pick(i){
  if(composing||!q.value.trim()||sug.style.display==='none') return;
  const n=sugList[i];if(!n||!visN(n))return;
  q.value='';hideSearch();q.blur();select(n.id);
}
function markSuggestion(){
  sug.querySelectorAll('[data-i]').forEach((b,i)=>b.setAttribute('aria-selected',i===sugOn?'true':'false'));
  if(sugList[sugOn])q.setAttribute('aria-activedescendant','sopt-'+sugList[sugOn].id);else q.removeAttribute('aria-activedescendant');
}
q.addEventListener('compositionstart',()=>{composing=true});
q.addEventListener('compositionend',()=>{composing=false;search()});
q.addEventListener('input',e=>{clearSearch.hidden=!q.value;if(!e.isComposing&&!composing)search()});
q.addEventListener('focus',()=>{closeMenus();if(q.value.trim())search()});
q.addEventListener('focus',()=>$('.search').classList.add('open'));
function collapseSearch(){setTimeout(()=>{const b=$('.search');if(!b.contains(document.activeElement)&&!q.value.trim())b.classList.remove('open')},180)}
q.addEventListener('blur',collapseSearch);
$('.search').addEventListener('focusout',()=>requestAnimationFrame(()=>{if(!document.activeElement.closest('.search'))hideSearch()}));
q.addEventListener('keydown',e=>{
  if(composing||e.isComposing||e.keyCode===229)return;
  if(e.key==='Escape'){e.preventDefault();e.stopPropagation();q.value='';hideSearch();q.blur();return}
  if(e.key==='Enter'){e.preventDefault();if(q.getAttribute('aria-expanded')==='true')pick(Math.max(0,sugOn));return}
  if(!['ArrowDown','ArrowUp'].includes(e.key))return;
  e.preventDefault();if(q.getAttribute('aria-expanded')!=='true'&&q.value.trim())search();
  if(!sugList.length)return;
  sugOn=e.key==='ArrowDown'?Math.min(sugList.length-1,sugOn+1):(sugOn<0?sugList.length-1:Math.max(0,sugOn-1));markSuggestion();
});
clearSearch.onpointerdown=e=>e.preventDefault();
clearSearch.onclick=()=>{q.value='';hideSearch();q.focus()};

// ---------- Chapter and appearance popovers ----------
const grid=$("#cgrid"), paletteMenu=$("#palette-menu"), cbtn=$("#cbtn"), paletteButton=$("#palette-btn");
grid.innerHTML='<div class="picker-head"><span>选择回目</span><button type="button" id="resume-ch" hidden></button></div><div class="gtop"></div><div class="chapter-list"></div>';
[['start','全书 · 开篇'],['end','全书 · 终局']].forEach(([m,t])=>{
  const b=document.createElement('button');b.type='button';b.textContent=t;b.dataset.m=m;
  b.onclick=()=>{setMode(m);render();fit(false);closeMenu(grid,true)};grid.querySelector('.gtop').appendChild(b);
});
DATA.chapters.forEach(c=>{
  const b=document.createElement('button');b.type='button';b.textContent=c.n;b.dataset.n=c.n;b.title=`第${c.n}回　${c.t}`;b.setAttribute('aria-label',`第 ${c.n} 回`);
  b.onclick=()=>{setChapter(c.n);closeMenu(grid,true)};grid.querySelector('.chapter-list').appendChild(b);
});
$('#resume-ch').onclick=()=>{setChapter(chapter);closeMenu(grid,true)};
function markGrid(){
  grid.querySelectorAll('[data-m],[data-n]').forEach(b=>{
    const active=b.dataset.m?b.dataset.m===mode:mode==='ch'&&+b.dataset.n===chapter;
    b.classList.toggle('cur',active);b.setAttribute('aria-pressed',String(active));
    if(b.dataset.n){if(active)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')}
  });
  $('#resume-ch').hidden=mode==='ch';$('#resume-ch').textContent=`回到第 ${chapter} 回`;
}
paletteMenu.innerHTML='<div class="picker-head"><span>选择配色</span></div><div class="palette-options"></div>';
PALETTES.forEach(p=>{
  const b=document.createElement('button');b.type='button';b.className='palette-option';b.dataset.pal=p.id;
  b.setAttribute('aria-label','配色 '+(PALETTES.indexOf(p)+1));
  b.innerHTML=`<span class="palette-sample" aria-hidden="true" ><i></i><i></i><i></i></span><span class="check" aria-hidden="true">✓</span>`;
  b.onclick=()=>{palette=p.id;applyAppearance();saveAppearance();markAppearance()};
  paletteMenu.querySelector('.palette-options').appendChild(b);
});
function saveAppearance(){
  try{localStorage.setItem('hlm-pal',palette);localStorage.removeItem('hlm-theme')}catch(_){}
  // An explicit palette URL should keep reflecting the option currently on screen.
  try{const url=new URL(location.href);if(palette==='p0')url.searchParams.delete('pal');else url.searchParams.set('pal',palette);history.replaceState(null,'',url)}catch(_){}
}
function markAppearance(){
  paletteMenu.querySelectorAll('[data-pal]').forEach(b=>{
    b.setAttribute('aria-pressed',String(b.dataset.pal===palette));
    const chosen=PALETTES.find(p=>p.id===b.dataset.pal),tokens=chosen.tokens,sample=b.querySelector('.palette-sample');
    [['--sample-bg','--bg'],['--sample-a','--c-jia1'],['--sample-b','--c-jia2'],['--sample-c','--c-other']].forEach(([key,token])=>sample.style.setProperty(key,tokens[token]));
  });
}
function menuButton(menu){return menu===grid?cbtn:paletteButton}
function closeMenu(menu,restore=false){
  menu.hidden=true;menuButton(menu).setAttribute('aria-expanded','false');if(restore)menuButton(menu).focus();
}
function closeMenus(){closeMenu(grid);closeMenu(paletteMenu)}
function placeMenu(menu){
  const r=menuButton(menu).getBoundingClientRect(), vv=window.visualViewport;
  const x=vv?vv.offsetLeft:0,y=vv?vv.offsetTop:0,W=vv?vv.width:innerWidth,H=vv?vv.height:innerHeight;
  const w=Math.min(menu===grid?504:304,W-24);
  menu.style.width=w+'px';menu.style.left=Math.max(x+12,Math.min(menu===grid?r.left:r.right-w,x+W-w-12))+'px';
  const below=y+H-r.bottom-20,above=r.top-y-20;
  const natural=menu.scrollHeight;
  let available,top;
  if(below>=Math.min(natural,240)||below>=above){available=Math.max(44,below);top=r.bottom+8}
  else{available=Math.max(44,above);top=r.top-8-Math.min(natural,available)}
  if(available>H-24||top<y+12||top+Math.min(natural,available)>y+H-12){available=Math.max(44,H-24);top=y+12}
  menu.style.maxHeight=available+'px';menu.style.top=top+'px';
}
function openMenu(menu){
  closeMenus();hideSearch();markGrid();markAppearance();menu.hidden=false;menuButton(menu).setAttribute('aria-expanded','true');placeMenu(menu);
  const current=menu.querySelector('.cur,[aria-pressed="true"]')||menu.querySelector('button:not([hidden])');
  if(current){current.focus({preventScroll:true});current.scrollIntoView({block:'nearest'})}
}
function toggleMenu(menu){if(menu.hidden)openMenu(menu);else closeMenu(menu,true)}
cbtn.onclick=()=>toggleMenu(grid);paletteButton.onclick=()=>toggleMenu(paletteMenu);
function menuKeys(e,menu){
  if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeMenu(menu,true);return}
  if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key))return;
  const buttons=[...menu.querySelectorAll('button:not([hidden]):not(:disabled)')], i=buttons.indexOf(document.activeElement);
  if(i<0)return;e.preventDefault();e.stopPropagation();
  let step=1;
  if(menu===paletteMenu&&['ArrowUp','ArrowDown'].includes(e.key))step=5;
  if(menu===grid&&document.activeElement.dataset.n&&['ArrowUp','ArrowDown'].includes(e.key))step=getComputedStyle(grid.querySelector('.chapter-list')).gridTemplateColumns.split(' ').length;
  let next=e.key==='Home'?0:e.key==='End'?buttons.length-1:i+(['ArrowLeft','ArrowUp'].includes(e.key)?-step:step);
  next=Math.max(0,Math.min(buttons.length-1,next));buttons[next].focus();
}
[grid,paletteMenu].forEach(menu=>{
  menu.addEventListener('keydown',e=>menuKeys(e,menu));
});
// 键盘 Tab 走出菜单时收起。注意不能用 focusout：Safari 里点按钮不会让按钮获得焦点，按下的瞬间焦点就回到 body，菜单会在点击生效前先被关掉（表现为「点不动」）。
document.addEventListener('focusin',e=>{[grid,paletteMenu].forEach(menu=>{ if(!menu.hidden&&!menu.contains(e.target)&&e.target!==menuButton(menu)) closeMenu(menu); });});
function repositionMenus(){if(!grid.hidden)placeMenu(grid);if(!paletteMenu.hidden)placeMenu(paletteMenu)}
window.addEventListener('resize',repositionMenus);window.visualViewport?.addEventListener('resize',repositionMenus);window.visualViewport?.addEventListener('scroll',repositionMenus);
document.addEventListener('pointerdown',e=>{
  if(!e.target.closest('#cgrid,#cbtn'))closeMenu(grid);
  if(!e.target.closest('#palette-menu,#palette-btn'))closeMenu(paletteMenu);
  if(!e.target.closest('.search'))hideSearch();
});
// The chapter shortcuts apply only in chapter mode and outside editing/menu controls.
$('#prev').onclick=()=>{if(mode==='ch'&&chapter>1)setChapter(chapter-1)};
$('#next').onclick=()=>{if(mode==='ch'&&chapter<120)setChapter(chapter+1)};
window.addEventListener('keydown',e=>{
  if(e.defaultPrevented||e.isComposing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.target.closest('input,textarea,select,[contenteditable="true"],.popover'))return;
  if(e.key==='Escape'){
    if(!grid.hidden)closeMenu(grid,true);else if(!paletteMenu.hidden)closeMenu(paletteMenu,true);else if(!$('#lgdetail').hidden){setLegendOpen(false);$('#lgbtn').focus()}else closePanel();
  }else if(e.key==='ArrowLeft'&&mode==='ch'){e.preventDefault();setChapter(chapter-1)}
  else if(e.key==='ArrowRight'&&mode==='ch'){e.preventDefault();setChapter(chapter+1)}
  else if(e.key==='/'){e.preventDefault();q.focus()}
  else if(e.key==='+'||e.key==='=')$('#zin').click();else if(e.key==='-')$('#zout').click();
});
markAppearance();

markGrid();
render(); fit(false); fitReady=true;
(function(){const h=document.querySelector('.hint'); if(!h) return; const gone=()=>h.classList.add('gone'); svg.addEventListener('pointerdown',gone,{once:true}); svg.addEventListener('wheel',gone,{once:true}); setTimeout(gone,9000);})(); if(QP.get('sel')&&byId[QP.get('sel')]) select(QP.get('sel'));


</script>
</body>
